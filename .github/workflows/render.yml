name: Render Video

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: '要渲染的任务ID'
        required: true
        type: string
      run_id:
        description: '本次渲染的回调幂等ID，用于忽略被取消的旧任务回调'
        required: false
        type: string
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # 同一个task_id如果被再次触发（手滑连点两次、或者失败后马上重试），
      # 直接取消上一个还没跑完的实例，不让两个渲染任务同时跑、抢着上传/回调同一个task_id，
      # 不同任务之间用的是不同的task_id、各有各的group，互不影响
      group: render-video-${{ inputs.task_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # v273.23：跟poster.yml一样，加apt包缓存——VA-API/VDPAU/OpenCL这些硬件加速库是
      # ffmpeg核心组件的硬依赖，--no-install-recommends砍不掉，真正省时间要靠不重复下载。
      - name: 缓存apt软件包（避免每次都重新下载ffmpeg这269MB依赖）
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ffmpeg-noto-ubuntu-v1

      - name: 安装依赖（ffmpeg + 中文字体 + edge-tts + 上传/回调所需库）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji
          pip install --quiet edge-tts requests boto3 Pillow

      - name: 缓存 Whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-${{ hashFiles('requirements-stage2.txt') }}-small
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: 安装"AI营销工厂"阶段新增的可选依赖（节拍检测用numpy、自定义配音转字幕用
          faster-whisper）——这两个功能代码本身有优雅降级（装不上会跳过对应功能，不会
          让整个渲染失败），但装上才能真正用上这两个功能，不是摆设
        run: |
          pip install --quiet -r requirements-stage2.txt || echo "可选依赖安装失败，节拍同步/自定义配音转字幕这两个功能会被跳过，其余功能不受影响"

      - name: 下载字幕艺术字体（Google Fonts官方OFL开源协议分发，免费商用）
        run: |
          mkdir -p fonts
          download_font() {
            curl -sL --fail --retry 2 --max-time 30 -o "$2" "$1" || echo "WARN: 未能下载 $2，将回退系统已安装的 Noto 字体"
          }
          download_font "https://github.com/google/fonts/raw/main/ofl/zcoolkuaile/ZCOOLKuaiLe-Regular.ttf" fonts/ZCOOLKuaiLe-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/zcoolqingkehuangyou/ZCOOLQingKeHuangYou-Regular.ttf" fonts/ZCOOLQingKeHuangYou-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/zcoolxiaowei/ZCOOLXiaoWei-Regular.ttf" fonts/ZCOOLXiaoWei-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/mashanzheng/MaShanZheng-Regular.ttf" fonts/MaShanZheng-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/zhimangxing/ZhiMangXing-Regular.ttf" fonts/ZhiMangXing-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/longcang/LongCang-Regular.ttf" fonts/LongCang-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/liujianmaocao/LiuJianMaoCao-Regular.ttf" fonts/LiuJianMaoCao-Regular.ttf

      - name: 执行渲染
        env:
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ inputs.run_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
        run: python render.py

      - name: 失败或被取消时也要通知Cloudflare（避免任务卡在"合成中"）
        # 只写if: failure()漏了一种情况：15分钟超时会让这次运行的结论是"cancelled"，
        # 不是"failure"，if: failure()压根不会触发，导致任务卡在"合成中"，只能等前端下次
        # 轮询触发selfHealFromR2兜底检查才可能被纠正过来。这里把cancelled()也加上，
        # 超时/被新一次触发取消掉，都能第一时间把状态改回failed，不用干等
        if: failure() || cancelled()
        env:
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ inputs.run_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
        run: |
          # v273.25：不再用 -L 跟随 301/302。curl 跟随跳转会把 POST 变成 GET，密钥和状态都送不到接口。
          # 这里把地址规范成 https，遇到重定向直接失败并打印 Location，提醒把 PAGES_BASE_URL 改成最终地址。
          # 密钥只放在 X-Render-Secret 请求头；带上 run_id，这样被新任务取消的旧回调会被 Worker 忽略。
          BASE="${PAGES_BASE_URL:-}"
          BASE="${BASE%/}"
          case "$BASE" in
            http://*) BASE="https://${BASE#http://}" ;;
            https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          STATUS="failed"
          ERR="渲染步骤执行失败，请查看 GitHub Actions 日志"
          if [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="cancelled"
            ERR="渲染任务被取消或超时（若已重新触发，这次通知会被忽略）"
          fi
          RUN_JSON=""
          if [ -n "${RUN_ID}" ]; then
            RUN_JSON=", \"run_id\": \"${RUN_ID}\""
          fi
          set +e
          status_code=$(curl -sS --max-redirs 0 -o /tmp/cb_body -w "%{http_code}" -X POST "$BASE/api/render-callback" \
            -H "Content-Type: application/json" \
            -H "X-Render-Secret: $RENDER_SECRET" \
            -d "{\"task_id\": \"$TASK_ID\"${RUN_JSON}, \"status\": \"$STATUS\", \"error\": \"$ERR\"}")
          curl_exit=$?
          set -e
          echo "通知Cloudflare的回调HTTP状态码：$status_code（curl exit=$curl_exit）"
          if [ -f /tmp/cb_body ]; then echo "回调响应：$(head -c 300 /tmp/cb_body)"; fi
          if [ "$status_code" = "301" ] || [ "$status_code" = "302" ] || [ "$status_code" = "303" ] || [ "$status_code" = "307" ] || [ "$status_code" = "308" ]; then
            echo "PAGES_BASE_URL 发生重定向，请把 GitHub Secret 改成最终 https 地址。本次未能同步状态。"
          fi
