name: Daka standalone speech 152
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Audio job UUID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: daka-tts152-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # official v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Identify compatible dependency environment
        id: deps
        run: |
          echo "TTS_DEP_DIR=$RUNNER_TOOL_CACHE/daka-tts152-deps-v2" >> "$GITHUB_ENV"
          identity=$(python -I -B tts152_backend/bootstrap.py --identity)
          echo "key=tts152-venv-v2-${{ runner.os }}-${{ runner.arch }}-$identity" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies only
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # official v4
        with:
          path: ${{ env.TTS_DEP_DIR }}
          key: ${{ steps.deps.outputs.key }}
          enableCrossOsArchive: false
      - name: Validate cached environment or rebuild from hashed official wheels
        run: python -I -B tts152_backend/bootstrap.py
      - name: Cache ready environment before any job text or secrets are loaded
        continue-on-error: true
        if: steps.cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # official v4
        with:
          path: ${{ env.TTS_DEP_DIR }}
          key: ${{ steps.deps.outputs.key }}
      - name: Synthesize and return private audio
        env:
          TTS_API_BASE: ${{ vars.TTS_API_BASE }}
          TTS_RENDER_SECRET: ${{ secrets.TTS_RENDER_SECRET }}
          TTS_JOB_ID: ${{ inputs.job_id }}
        run: '"$TTS_DEP_DIR/bin/python" -I -B tts152_backend/runner.py'
