name: Generate Poster

on:
  workflow_dispatch:
    inputs:
      poster_id:
        description: '要生成的海报任务ID'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: render-poster-${{ inputs.poster_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # v273.23：v273.22加的--no-install-recommends只砍掉了ffmpeg的"推荐"依赖，
      # 但用户这次的日志显示还是要下89个包、269MB——一查才发现libva2/libvdpau1/
      # libvpl2/ocl-icd-libopencl1这些VA-API/VDPAU/OpenCL硬件加速库，实际上是
      # ffmpeg核心组件（libavcodec/libavutil这些.so文件）编译时链接进去的**硬依赖**，
      # 不是"推荐"，--no-install-recommends这种参数动不了它们，Ubuntu的ffmpeg包
      # 就是这么打包的，没有更小的等价替代。也就是说v273.22那次"应该会明显变快"的说法
      # 说得有点满了，实际只帮忙去掉了一部分推荐包，没能碰到这些真正占大头的硬依赖。
      # 真正的解法不是"少装"，是"别每次都重新下载"——这269MB每次运行都是同一批
      # 具体版本号的.deb文件，用actions/cache把下载缓存跨次保留下来，第一次跑完之后，
      # 之后的每一次运行只要版本没变，就能直接从缓存里拿现成的，不用再重新联网下载，
      # 这一步应该能从几分钟缩短到几秒钟。
      - name: 缓存apt软件包（避免每次都重新下载ffmpeg这269MB依赖）
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-poster-${{ runner.os }}-v1

      - name: 安装依赖（ffmpeg + 中文字体 + Pillow + 二维码库）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install --quiet requests boto3 Pillow qrcode

      - name: 下载海报标题艺术字体（站酷快乐体，Google Fonts官方OFL开源协议分发，免费商用）
        run: |
          mkdir -p fonts
          curl -sL --fail -o fonts/ZCOOLKuaiLe-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/zcoolkuaile/ZCOOLKuaiLe-Regular.ttf"

      - name: 下载"诗意品牌版"专用字体库（5款，同一个Google Fonts官方OFL开源协议家族，免费商用）
        run: |
          curl -sL --fail -o fonts/ZCOOLXiaoWei-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/zcoolxiaowei/ZCOOLXiaoWei-Regular.ttf"
          curl -sL --fail -o fonts/MaShanZheng-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/mashanzheng/MaShanZheng-Regular.ttf"
          curl -sL --fail -o fonts/ZhiMangXing-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/zhimangxing/ZhiMangXing-Regular.ttf"
          curl -sL --fail -o fonts/LongCang-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/longcang/LongCang-Regular.ttf"
          curl -sL --fail -o fonts/LiuJianMaoCao-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/liujianmaocao/LiuJianMaoCao-Regular.ttf"

      - name: 生成海报
        env:
          POSTER_ID: ${{ inputs.poster_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python poster.py

      - name: 失败或被取消时也要通知Cloudflare
        if: failure() || cancelled()
        env:
          POSTER_ID: ${{ inputs.poster_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
        run: |
          # v273.24：这一步之前用的是裸curl，遇到301/302重定向（比如PAGES_BASE_URL这个
          # 密钥填的域名跟Cloudflare那边认定的规范网址不完全一致，被自动跳转了一下）就会
          # 直接把跳转页面的HTML内容当成"响应"收下，实际上根本没请求到真正的回调接口，
          # 数据库里这条任务的状态永远不会被更新成"失败/已取消"，网页上会一直显示"生成中"，
          # 明明任务早就没了却看不出来。加上-L让curl自动跟着跳转走完，同时把最终的HTTP状态码
          # 打印到日志里，方便以后再遇到类似情况一眼就能看出这一步到底有没有真的通知成功。
          status_code=$(curl -s -L -o /dev/null -w "%{http_code}" -X POST "$PAGES_BASE_URL/api/poster-callback" \
            -H "Content-Type: application/json" \
            -d "{\"poster_id\": \"$POSTER_ID\", \"secret\": \"$RENDER_SECRET\", \"status\": \"failed\", \"error\": \"海报生成步骤执行失败，请查看 GitHub Actions 日志\"}")
          echo "通知Cloudflare的回调HTTP状态码：$status_code"
