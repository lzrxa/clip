name: Generate Poster

on:
  workflow_dispatch:
    inputs:
      poster_id:
        description: '要生成的海报任务ID'
        required: true
        type: string
      run_id:
        description: '本次生成的回调幂等ID，用于忽略被取消的旧任务回调'
        required: false
        type: string
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: render-poster-${{ inputs.poster_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # v273.23：v273.22加的--no-install-recommends只砍掉了ffmpeg的"推荐"依赖，
      # 但用户这次的日志显示还是要下89个包、269MB——一查才发现libva2/libvdpau1/
      # libvpl2/ocl-icd-libopencl1这些VA-API/VDPAU/OpenCL硬件加速库，实际上是
      # ffmpeg核心组件（libavcodec/libavutil这些.so文件）编译时链接进去的**硬依赖**，
      # 不是"推荐"，--no-install-recommends这种参数动不了它们，Ubuntu的ffmpeg包
      # 就是这么打包的，没有更小的等价替代。也就是说v273.22那次"应该会明显变快"的说法
      # 说得有点满了，实际只帮忙去掉了一部分推荐包，没能碰到这些真正占大头的硬依赖。
      # 真正的解法不是"少装"，是"别每次都重新下载"——这269MB每次运行都是同一批
      # 具体版本号的.deb文件，用actions/cache把下载缓存跨次保留下来，第一次跑完之后，
      # 之后的每一次运行只要版本没变，就能直接从缓存里拿现成的，不用再重新联网下载，
      # 这一步应该能从几分钟缩短到几秒钟。
      - name: 缓存apt软件包（避免每次都重新下载ffmpeg这269MB依赖）
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ffmpeg-noto-ubuntu-v1

      - name: 安装依赖（ffmpeg + 中文字体 + Pillow + 二维码库）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install --quiet requests boto3 Pillow qrcode

      - name: 下载海报标题艺术字体（站酷快乐体，Google Fonts官方OFL开源协议分发，免费商用）
        run: |
          mkdir -p fonts
          curl -sL --fail --retry 2 --max-time 30 -o fonts/ZCOOLKuaiLe-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/zcoolkuaile/ZCOOLKuaiLe-Regular.ttf" || echo "WARN: 快乐体下载失败，将回退系统字体"

      - name: 下载"诗意品牌版"专用字体库（5款，同一个Google Fonts官方OFL开源协议家族，免费商用）
        run: |
          download_font() {
            curl -sL --fail --retry 2 --max-time 30 -o "$2" "$1" || echo "WARN: 未能下载 $2，将回退系统字体"
          }
          download_font "https://github.com/google/fonts/raw/main/ofl/zcoolxiaowei/ZCOOLXiaoWei-Regular.ttf" fonts/ZCOOLXiaoWei-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/mashanzheng/MaShanZheng-Regular.ttf" fonts/MaShanZheng-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/zhimangxing/ZhiMangXing-Regular.ttf" fonts/ZhiMangXing-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/longcang/LongCang-Regular.ttf" fonts/LongCang-Regular.ttf
          download_font "https://github.com/google/fonts/raw/main/ofl/liujianmaocao/LiuJianMaoCao-Regular.ttf" fonts/LiuJianMaoCao-Regular.ttf

      - name: 生成海报
        env:
          POSTER_ID: ${{ inputs.poster_id }}
          RUN_ID: ${{ inputs.run_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python poster.py

      - name: 失败或被取消时也要通知Cloudflare
        if: failure() || cancelled()
        env:
          POSTER_ID: ${{ inputs.poster_id }}
          RUN_ID: ${{ inputs.run_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
        run: |
          # v273.25：不再用 -L 跟随 301/302。curl 跟随跳转会把 POST 变成 GET，状态同步会失败。
          BASE="${PAGES_BASE_URL:-}"
          BASE="${BASE%/}"
          case "$BASE" in
            http://*) BASE="https://${BASE#http://}" ;;
            https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          STATUS="failed"
          ERR="海报生成步骤执行失败，请查看 GitHub Actions 日志"
          if [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="cancelled"
            ERR="海报任务被取消或超时（若已重新触发，这次通知会被忽略）"
          fi
          RUN_JSON=""
          if [ -n "${RUN_ID}" ]; then
            RUN_JSON=", \"run_id\": \"${RUN_ID}\""
          fi
          set +e
          status_code=$(curl -sS --max-redirs 0 -o /tmp/cb_body -w "%{http_code}" -X POST "$BASE/api/poster-callback" \
            -H "Content-Type: application/json" \
            -H "X-Render-Secret: $RENDER_SECRET" \
            -d "{\"poster_id\": \"$POSTER_ID\"${RUN_JSON}, \"status\": \"$STATUS\", \"error\": \"$ERR\"}")
          curl_exit=$?
          set -e
          echo "通知Cloudflare的回调HTTP状态码：$status_code（curl exit=$curl_exit）"
          if [ -f /tmp/cb_body ]; then echo "回调响应：$(head -c 300 /tmp/cb_body)"; fi
          if [ "$status_code" = "301" ] || [ "$status_code" = "302" ] || [ "$status_code" = "303" ] || [ "$status_code" = "307" ] || [ "$status_code" = "308" ]; then
            echo "PAGES_BASE_URL 发生重定向，请把 GitHub Secret 改成最终 https 地址。本次未能同步状态。"
          fi
