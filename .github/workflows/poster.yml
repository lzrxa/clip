name: Generate Poster
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      poster_id:
        description: '要生成的海报任务ID'
        required: true
        type: string
env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: render-poster-${{ inputs.poster_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: render-repo/requirements-poster.txt
      - name: 准备系统依赖（仅缺失时安装）
        run: |
          NEED_APT=0
          command -v ffmpeg >/dev/null 2>&1 || NEED_APT=1
          fc-match 'Noto Sans CJK SC' >/dev/null 2>&1 || NEED_APT=1
          if [ "$NEED_APT" = "1" ]; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-noto-color-emoji
          else
            echo 'Runner 已自带 ffmpeg/CJK 字体，跳过 apt 安装。'
          fi
      - name: 缓存海报艺术字体
        uses: actions/cache@v4
        with:
          path: render-repo/fonts
          key: fonts-poster-v2502-${{ runner.os }}-${{ hashFiles('render-repo/.github/workflows/poster.yml') }}
      - name: 安装 Python 依赖并准备字体
        shell: bash
        run: |
          set -euo pipefail
          cd render-repo
          mkdir -p fonts
          if [ ! -f fonts/ZCOOLKuaiLe-Regular.ttf ]; then
            curl -sL --fail -o fonts/ZCOOLKuaiLe-Regular.ttf 'https://github.com/google/fonts/raw/main/ofl/zcoolkuaile/ZCOOLKuaiLe-Regular.ttf' & p1=$!
            curl -sL --fail -o fonts/ZCOOLXiaoWei-Regular.ttf 'https://github.com/google/fonts/raw/main/ofl/zcoolxiaowei/ZCOOLXiaoWei-Regular.ttf' & p2=$!
            curl -sL --fail -o fonts/MaShanZheng-Regular.ttf 'https://github.com/google/fonts/raw/main/ofl/mashanzheng/MaShanZheng-Regular.ttf' & p3=$!
            curl -sL --fail -o fonts/ZhiMangXing-Regular.ttf 'https://github.com/google/fonts/raw/main/ofl/zhimangxing/ZhiMangXing-Regular.ttf' & p4=$!
            curl -sL --fail -o fonts/LongCang-Regular.ttf 'https://github.com/google/fonts/raw/main/ofl/longcang/LongCang-Regular.ttf' & p5=$!
            curl -sL --fail -o fonts/LiuJianMaoCao-Regular.ttf 'https://github.com/google/fonts/raw/main/ofl/liujianmaocao/LiuJianMaoCao-Regular.ttf' & p6=$!
            wait $p1 $p2 $p3 $p4 $p5 $p6
          fi
          python -m pip install --prefer-binary --quiet -r requirements-poster.txt
      - name: 生成海报
        env:
          POSTER_ID: ${{ inputs.poster_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: cd render-repo && python poster.py
      - name: 失败或被取消时也要通知Cloudflare
        if: failure() || cancelled()
        env:
          POSTER_ID: ${{ inputs.poster_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
        run: |
          curl -sS --retry 3 --retry-delay 1 -X POST "$PAGES_BASE_URL/api/poster-callback" \
            -H 'Content-Type: application/json' \
            -d "{\"poster_id\": \"$POSTER_ID\", \"secret\": \"$RENDER_SECRET\", \"status\": \"failed\", \"error\": \"海报生成步骤执行失败，请查看 GitHub Actions 日志\"}"
