name: Scene Split

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: '拆条任务ID'
        required: true
        type: string
      source_key:
        description: '要拆分的源视频在R2里的key'
        required: true
        type: string
      task_domain:
        description: '导入的素材归到哪个领域（travel/music）'
        required: false
        type: string
        default: 'travel'
      task_region:
        description: '导入的素材标注哪个地区'
        required: false
        type: string
        default: ''
      run_id:
        description: '本次拆条的回调幂等ID，用于忽略被取消的旧任务回调'
        required: false
        type: string
        default: ''

jobs:
  scene-split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: scene-split-${{ inputs.job_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # v273.23：跟另外两个工作流一样，加apt包缓存。
      - name: 缓存apt软件包（避免每次都重新下载ffmpeg这269MB依赖）
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ffmpeg-noto-ubuntu-v1

      - name: 安装依赖（ffmpeg + 上传/回调/AI识别所需库）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install --quiet requests boto3

      - name: 执行智能拆条
        env:
          JOB_ID: ${{ inputs.job_id }}
          SOURCE_KEY: ${{ inputs.source_key }}
          TASK_DOMAIN: ${{ inputs.task_domain }}
          TASK_REGION: ${{ inputs.task_region }}
          RUN_ID: ${{ inputs.run_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python scene_split.py

      - name: 失败或被取消时也要通知Cloudflare（避免任务卡在"处理中"）
        if: failure() || cancelled()
        env:
          JOB_ID: ${{ inputs.job_id }}
          RUN_ID: ${{ inputs.run_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
        run: |
          # v273.25：不再用 -L 跟随 301/302，密钥改走请求头，并附带 run_id。
          BASE="${PAGES_BASE_URL:-}"
          BASE="${BASE%/}"
          case "$BASE" in
            http://*) BASE="https://${BASE#http://}" ;;
            https://*) ;;
            *) BASE="https://$BASE" ;;
          esac
          STATUS="failed"
          ERR="拆条步骤执行失败，请查看 GitHub Actions 日志"
          if [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="cancelled"
            ERR="拆条任务被取消或超时（若已重新触发，这次通知会被忽略）"
          fi
          RUN_JSON=""
          if [ -n "${RUN_ID}" ]; then
            RUN_JSON=", \"run_id\": \"${RUN_ID}\""
          fi
          set +e
          status_code=$(curl -sS --max-redirs 0 -o /tmp/cb_body -w "%{http_code}" -X POST "$BASE/api/scene-split-callback" \
            -H "Content-Type: application/json" \
            -H "X-Render-Secret: $RENDER_SECRET" \
            -d "{\"job_id\": \"$JOB_ID\"${RUN_JSON}, \"status\": \"$STATUS\", \"error\": \"$ERR\"}")
          curl_exit=$?
          set -e
          echo "通知Cloudflare的回调HTTP状态码：$status_code（curl exit=$curl_exit）"
          if [ -f /tmp/cb_body ]; then echo "回调响应：$(head -c 300 /tmp/cb_body)"; fi
          if [ "$status_code" = "301" ] || [ "$status_code" = "302" ] || [ "$status_code" = "303" ] || [ "$status_code" = "307" ] || [ "$status_code" = "308" ]; then
            echo "PAGES_BASE_URL 发生重定向，请把 GitHub Secret 改成最终 https 地址。本次未能同步状态。"
          fi
