name: Scene Split
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: '拆条任务ID'
        required: true
        type: string
      source_key:
        description: '要拆分的源视频在R2里的key'
        required: true
        type: string
      task_domain:
        description: '导入的素材归到哪个领域（travel/music）'
        required: false
        type: string
        default: 'travel'
      task_region:
        description: '导入的素材标注哪个地区'
        required: false
        type: string
        default: ''
env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  scene-split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: scene-split-${{ inputs.job_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: render-repo/requirements-scene.txt
      - name: 准备 ffmpeg（仅缺失时安装）
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then echo 'Runner 已自带 ffmpeg，跳过 apt。'; else sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg; fi
      - name: 安装 Python 依赖
        run: cd render-repo && python -m pip install --prefer-binary --quiet -r requirements-scene.txt
      - name: 执行智能拆条
        env:
          JOB_ID: ${{ inputs.job_id }}
          SOURCE_KEY: ${{ inputs.source_key }}
          TASK_DOMAIN: ${{ inputs.task_domain }}
          TASK_REGION: ${{ inputs.task_region }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: cd render-repo && python scene_split.py
      - name: 失败或被取消时也要通知Cloudflare
        if: failure() || cancelled()
        env:
          JOB_ID: ${{ inputs.job_id }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
        run: |
          curl -sS --retry 3 --retry-delay 1 -X POST "$PAGES_BASE_URL/api/scene-split-callback" \
            -H 'Content-Type: application/json' \
            -d "{\"job_id\": \"$JOB_ID\", \"secret\": \"$RENDER_SECRET\", \"status\": \"failed\", \"error\": \"拆条步骤执行失败，请查看 GitHub Actions 日志\"}"
